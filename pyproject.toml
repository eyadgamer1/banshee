[project]
name = "pythonprojectscanner"
version = "0.1.0"
description = "Passive-first network scanner — no exploitation"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "scapy>=2.5",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pyyaml>=6",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
]

[project.scripts]
pps = "scanner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
