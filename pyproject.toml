[project]
name = "banshee-scanner"
version = "1.3.0"
description = "BANSHEE — passive-first network scanner. No exploitation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["network", "scanner", "security", "pentest", "passive", "fingerprinting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "scapy>=2.5",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pyyaml>=6",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "zeroconf>=0.132",
]

[project.scripts]
banshee = "scanner.cli:app"

[project.urls]
Homepage = "https://github.com/eyadgamer1/banshee"
Repository = "https://github.com/eyadgamer1/banshee"
"Bug Tracker" = "https://github.com/eyadgamer1/banshee/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

# Ship the built-in default scope so an installed `banshee` has a working
# allowlist without a config/ tree in the working directory.
[tool.hatch.build.targets.wheel.force-include]
"scanner/data/default_scope.yaml" = "scanner/data/default_scope.yaml"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "types-PyYAML>=6",
]
