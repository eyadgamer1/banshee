name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine_bin: banshee-engine
          - os: windows-latest
            engine_bin: banshee-engine.exe

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Go vet & test
        working-directory: engine
        run: |
          go vet ./...
          go test ./...

      # Build into engine/ so the parity tests find it via the repo fallback and
      # actually run (they skip when no binary is present).
      - name: Build Go engine
        working-directory: engine
        run: go build -o ${{ matrix.engine_bin }} ./cmd/banshee-engine

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy scanner

      # Includes tests/test_ground_truth.py, which binds real TCP listeners on
      # 127.0.0.1, runs the real CLI, and asserts the reported open ports equal the
      # bound ports exactly — in both directions. Unprivileged: the raw-socket
      # discoverers (ICMP, passive sniffer) no-op gracefully without CAP_NET_RAW.
      - name: Test
        run: uv run pytest -q
