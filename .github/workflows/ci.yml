name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy scanner

      # Includes tests/test_ground_truth.py, which binds real TCP listeners on
      # 127.0.0.1, runs the real CLI, and asserts the reported open ports equal the
      # bound ports exactly — in both directions. Unprivileged: the raw-socket
      # discoverers (ICMP, passive sniffer) no-op gracefully without CAP_NET_RAW.
      - name: Test
        run: uv run pytest -q
