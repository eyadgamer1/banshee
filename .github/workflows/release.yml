name: Release

# Cross-compile the standalone Go engine and attach the binaries to the GitHub
# Release for a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`),
# so operators can run `--engine go` on a jump box or drop-box with no Go
# toolchain and no Python.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build
        working-directory: engine
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: >
          go build -trimpath -ldflags="-s -w"
          -o banshee-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          ./cmd/banshee-engine

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: engine/banshee-engine-*
