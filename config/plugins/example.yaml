# BANSHEE Plugin Rules — Example
#
# Drop .yaml files in config/plugins/ and run with --plugins.
# A file may hold one flat rule (top-level `id`) or many under `rules:`.
#
# Rule schema:
#   id           required — used to build the finding id
#   title        finding title
#   severity     critical | high | medium | low | info   (default: info)
#   confidence   confirmed | probable | potential        (default: potential)
#   description  finding body
#   match:
#     open_ports      list of ints — ANY match triggers
#     device_type     regex against host.device_type   (needs --classify)
#     hostname_regex  regex against host.hostname
#     os_regex        regex against host.os_guess
#   All conditions present in a match block must hold.

rules:
  - id: PLUGIN-001
    title: Telnet detected
    severity: high
    confidence: confirmed
    description: >
      Cleartext Telnet (port 23) is active. All credentials and session data
      are transmitted in plaintext and trivially interceptable.
    match:
      open_ports: [23, 2323]

  - id: PLUGIN-002
    title: FTP in cleartext
    severity: medium
    confidence: confirmed
    description: >
      FTP (port 21) transmits credentials and data without encryption.
      Replace with SFTP or FTPS.
    match:
      open_ports: [21]

  - id: PLUGIN-003
    title: RDP exposed to network
    severity: medium
    confidence: confirmed
    description: >
      Remote Desktop Protocol is reachable. Brute-force and credential-stuffing
      attacks are common against exposed RDP.
    match:
      open_ports: [3389]

  - id: PLUGIN-004
    title: SMB exposed
    severity: medium
    confidence: confirmed
    description: >
      SMB file sharing (445) is reachable. Historically the highest-value
      lateral-movement target on Windows networks.
    match:
      open_ports: [445]

  - id: PLUGIN-005
    title: Router admin interface on HTTP
    severity: high
    confidence: probable
    description: >
      A device classified as a router exposes a plaintext HTTP admin interface.
      Administrative credentials cross the wire unencrypted.
    match:
      open_ports: [80, 8080]
      device_type: rout
