# Defaults beneath CLI flags. Read by scanner/core/settings.py.
# Every key here is consumed by a real call site — do not add unread keys.

[llm]
# Used by --agentic (D1 ReAct loop and D4 report). Must be a model your local
# Ollama has pulled: `ollama pull <model>`.
model = "llama3"
base_url = "http://localhost:11434"
timeout_seconds = 60

[store]
# Default for --db. Pass --db PATH to override; omit both to disable persistence.
db_path = "output/banshee.db"
