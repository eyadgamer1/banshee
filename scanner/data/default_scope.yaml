banner: "AUTHORIZED TARGETS ONLY - open scope (any target); you are responsible for authorization"

# Open by default, like nmap: every IPv4 and IPv6 target is permitted.
# YOU are solely responsible for only scanning targets you are authorized to test.
#
# To put the safety rail back, replace the allowlist below with your own ranges
# (e.g. 10.0.0.0/8, 192.168.0.0/16) or pass --scope your_scope.yaml. The scope
# engine is unchanged and still enforces whatever allowlist/denylist you give it.
allowlist:
  - 0.0.0.0/0
  - "::/0"

# Add CIDRs here to carve out targets you must never touch (denylist wins over
# allowlist). Empty by default.
denylist: []

# Ceiling on how many addresses one invocation may expand to. 65536 is a full
# /16 — generous, but it still refuses a fat-fingered /12 (1,048,576 addresses)
# instead of materialising a million IP strings. Raise it deliberately if you
# really mean to sweep something larger.
max_hosts_per_scan: 65536
max_ports_per_host: 65535
